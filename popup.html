<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="styles/base.css" />
  <link rel="stylesheet" href="styles/controls.css" />
  <link rel="stylesheet" href="styles/domains.css" />
</head>
<body>
  <h1>Stay Focused</h1>

  <button id="toggle">...</button>

  <div id="reloadNotice" class="reload-notice" role="status">
    <span class="reload-icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M20 6v5h-5" />
        <path d="M18.5 15a7 7 0 1 1-.6-7.8L20 11" />
      </svg>
    </span>
    <span class="reload-message">
      <span class="reload-title">Settings changed</span>
      <span class="reload-description">Reload this page to apply</span>
    </span>
    <button id="reloadPage">Reload</button>
  </div>

  <div id="featureSettings" class="section">
    <div class="section-title">Blocked signals</div>
    <div class="feature-options">
      <label class="feature-option" title="Visibility API and visibilitychange events">
        <input type="checkbox" id="blockVisibility">
        <span class="feature-name">Visibility API</span>
      </label>
      <label class="feature-option" title="Window blur events">
        <input type="checkbox" id="blockBlur">
        <span class="feature-name">Blur</span>
      </label>
    </div>
  </div>
  
  <div class="section">
    <div class="section-title">Domain rules</div>
    <div class="domain-input-group">
      <input type="text" id="domainInput" placeholder="e.g., example.com">
      <button id="addDomain">Add</button>
    </div>
    <div class="rules-header" aria-hidden="true">
      <span>Domain</span>
      <span>Blur</span>
      <span>Visibility API</span>
      <span></span>
    </div>
    <div id="domainList"></div>
    <div class="rules-legend">
      <span><i class="rule-dot allow"></i>Allow</span>
      <span><i class="rule-dot inherit"></i>Global</span>
      <span><i class="rule-dot block"></i>Deny</span>
    </div>
  </div>
  
  <div class="section footer">
    <a class="test-link" href="https://nf-coder.github.io/visibility-test/" target="_blank" rel="noopener noreferrer">Test extension on demo page</a>
    <a class="test-link" href="https://github.com/NF-coder/stay-focused" target="_blank" rel="noopener noreferrer">View on GitHub</a>
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
