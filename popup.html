<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    :root {
      font-size: 12px;
      --text-secondary: #8f8f8f;
    }
    body {
      font-family: sans-serif;
      min-width: 300px;
      padding: 10px;
    }
    button {
      padding: 6px 12px;
      font-size: 14px;
      outline: none;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    #toggle {
      width: 100%;
      margin-bottom: 10px;
    }
    .section {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid #ddd;
    }
    .section-title {
      font-weight: bold;
      margin-bottom: 8px;
      font-size: 13px;
    }
    .domain-input-group {
      display: flex;
      gap: 5px;
      margin-bottom: 8px;
    }
    #domainInput {
      flex: 1;
      padding: 6px;
      font-size: 12px;
      border: 1px solid #ccc;
      border-radius: 3px;
      box-sizing: border-box;
    }
    #addDomain {
      background-color: #4CAF50;
      color: white;
      padding: 6px 10px;
    }
    #addDomain:hover {
      background-color: #45a049;
    }
    #domainList {
      max-height: 150px;
      overflow-y: auto;
    }
    .domain-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px;
      background-color: #f5f5f5;
      margin-bottom: 4px;
      border-radius: 3px;
      font-size: 12px;
    }
    .remove-btn {
      background-color: transparent;
      color: #666;
      border: none;
      padding: 0;
      font-size: 16px;
      cursor: pointer;
      width: 20px;
      height: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .remove-btn:hover {
      color: #f44336;
    }
    .small {
      font-family: Segoe UI, sans-serif;
      font-size: 0.9rem;
      color: var(--text-secondary);
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <button id="toggle">...</button>
  
  <div class="section">
    <div class="section-title">Automatically enable for domains:</div>
    <div class="domain-input-group">
      <input type="text" id="domainInput">
      <button id="addDomain">Add</button>
    </div>
    <div id="domainList"></div>
  </div>
  
  <p class="small">💡 Enabling for a domain will keep the add-on active even after page refreshes for that domain.</p>
  
  <script src="popup.js"></script>
</body>
</html>
